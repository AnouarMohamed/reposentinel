name: Self-scan & Badge Update

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run RepoSentinel
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit badge JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reposentinel-badge.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update reposentinel-badge.json [skip ci]" && git push)
